<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <script src="js/sessao.js"></script>
</head>

<body class="main-cadastro">
    <div>
        <header class="header">
            <section>
                <a href="#" class="logo">
                    <img src="images/estrela.png" alt="logo">
                    <h1 style="color: #FFF8B5;">Stardew <br><span style="color: white;">Prosperity</span></h1>
                </a>

                <nav class="navbar">
                    <a href="index.html"><img src="images/inicio.png" alt="casa" width="20px">Inicio</a>
                    <a href="calculadora.html"><img src="images/moeda.png" alt="dinheiro" width="20px">Calculadora</a>
                    <a href="minas.html"><img src="images/picareta.png" alt="picareta" width="20px"> Minas</a>
                    <a href="entrar.html"><img src="images/estrela(entrar).png" alt="login" width="20px">Entrar</a>
                    <a href="cadastro.html"><img src="images/The_Player_Icon.png" alt="folha" width="20px">Cadastro</a>
                </nav>
            </section>
        </header>

        <div class="cadastro-box">
            <img src="images/folha-cadastro.png" alt="folha">
            <h2>Entrar</h2>

            <label>Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Username">
            <span id="erro_usuario"></span>
            <label>Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Password">
            <span id="erro_senha"></span>
            <button onclick="entrar(usuario, senha, erro_usuario, erro_senha)">Acessar</button>

            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>

            <div id="div_aguardar"></div>
            <div id="div_erros_login"></div>
            <div id="cardErro"></div>
        </div>
    </div>

    <script>

        function entrar(usuario, senha, erro_usuario, erro_senha) {
            console.log("Estou")
            aguardar();

            let valorusuario = usuario.value;
            let valorsenha = senha.value;

            let temMaiuscula = /[A-Z]/.test(valorsenha);
            let temEspecial = /[^A-Za-z0-9]/.test(valorsenha);


            erro_usuario.innerHTML = "";
            erro_senha.innerHTML = "";


            let valido = true;

            if (valorusuario == "") {
                erro_usuario.innerHTML = "Preencha o usuário";
                erro_usuario.style.color = "red";
                valido = false;
                finalizarAguardar();
                return false;
            }

            if (valorsenha == "") {
                erro_senha.innerHTML = "Preencha a senha";
                erro_senha.style.color = "red";
                valido = false;
                finalizarAguardar();
                return false;
            } else if (valorsenha.length < 9) {
                erro_senha.innerHTML = "Mínimo 9 caracteres";
                erro_senha.style.color = "red";
                valido = false;
                finalizarAguardar();
                return false;
            } else if (!temMaiuscula) {
                erro_senha.innerHTML = "Precisa de letra maiúscula";
                erro_senha.style.color = "red";
                valido = false;
                finalizarAguardar();
                return false;
            } else if (!temEspecial) {
                erro_senha.innerHTML = "Precisa de caractere especial";
                erro_senha.style.color = "red";
                valido = false;
                finalizarAguardar();
                return false;
            } else {
                setInterval(sumirMensagem, 5000)
            }

            console.log("FORM LOGIN: ", valorusuario);
            console.log("FORM SENHA: ", valorsenha);

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: valorusuario,
                    senhaServer: valorsenha
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                        setTimeout(function () {
                            window.location = "dashboard/dashboard.html";
                        }, 1000); // apenas para exibir o loading

                    });

                } else {

                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);
                        finalizarAguardar(texto);
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })

            return false;
        }

        function sumirMensagem() {
            cardErro.style.display = "none"
        }

    </script>
</body>

</html>
